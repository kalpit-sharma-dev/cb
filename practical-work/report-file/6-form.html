<!DOCTYPE html>
<html>
<head>
  <title>Login Form</title>
</head>
<!--
  Aim: To make a form with a username box, a password box and a submit button.
  Tags used: form, label, input
-->
<body bgcolor="#f4f8ff">

  <h1 align="center"><font color="navy">Student Login</font></h1>
  <p align="center">N R Public School &mdash; Computer Lab</p>
  <hr>

  <form action="#" method="post">
    <table align="center" cellpadding="8" bgcolor="#eef5ff" style="border: 2px solid navy;">
      <tr>
        <td>
          <label for="username">Username:</label>
        </td>
        <td>
          <input type="text" id="username" name="username" size="28">
        </td>
      </tr>
      <tr>
        <td>
          <label for="password">Password:</label>
        </td>
        <td>
          <input type="password" id="password" name="password" size="28">
        </td>
      </tr>
      <tr>
        <td colspan="2" align="center">
          <input type="submit" value="Submit">
        </td>
      </tr>
    </table>
  </form>

  <p align="center">
    Type your username and password, then click Submit.
  </p>

  <hr>
  <p align="center"><a href="index.html">Back to Practical File</a></p>

</body>
</html>
