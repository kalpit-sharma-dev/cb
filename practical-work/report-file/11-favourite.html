<!DOCTYPE html>
<html>
<head>
  <title>My Favourite Things</title>
</head>
<!--
  Aim: To list my interests using an ordered list
  and unordered lists inside it.
  Background: light blue. Text: dark blue.
  Font: Times New Roman, size 6.
-->
<body bgcolor="lightblue" text="darkblue" style="background-color: lightblue; color: darkblue; font-family: 'Times New Roman', Times, serif;">

  <font face="Times New Roman" size="6">
    <ol type="i">
      <li>My Favourite Hobby
        <ul type="disc">
          <li>Gardening</li>
          <li>Reading</li>
          <li>Trekking</li>
        </ul>
      </li>
      <li>My Favourite Car
        <ul type="disc">
          <li>Honda City</li>
          <li>Innova</li>
          <li>Mercedes</li>
        </ul>
      </li>
      <li>My Favourite Food
        <ul type="disc">
          <li>Chinese</li>
          <li>Indian</li>
          <li>Mongolian</li>
        </ul>
      </li>
    </ol>
  </font>

  <p>
    <font face="Times New Roman" size="3">
      <a href="index.html">Back to Practical File</a>
    </font>
  </p>

</body>
</html>
