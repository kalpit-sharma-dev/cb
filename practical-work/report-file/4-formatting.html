<!DOCTYPE html>
<html>
<head>
  <title>Text Formatting Example</title>
</head>
<!--
  Aim: To show bold, italic and underline text.
  Tags used: b, i, u
-->
<body bgcolor="#f9f6ff">

  <h1 align="center"><font color="purple">Text Formatting Example</font></h1>
  <hr>

  <p><b>My favorite subject is Science.</b></p>

  <p><i>Hard work is the key to success.</i></p>

  <p><u>Always submit your homework on time.</u></p>

  <hr>
  <p><a href="index.html">Back to Practical File</a></p>

</body>
</html>
