<!DOCTYPE html>
<html>
<head>
  <title>Nested Tables</title>
  <!-- Internal CSS is used so the green and blue borders show clearly. -->
  <style>
    table.outer {
      border-collapse: collapse;
      border: 8px solid green;
      margin: 30px auto;
    }
    table.outer td {
      border: 4px solid green;
      text-align: center;
      font-size: 32px;
      padding: 16px 22px;
    }
    table.inner {
      border-collapse: collapse;
      border: 7px solid blue;
      margin: 10px auto;
    }
    table.inner td {
      border: 3px solid blue;
      text-align: center;
      font-size: 28px;
      padding: 14px 34px;
    }
  </style>
</head>
<!--
  Aim: To create a table inside another table.
  The outer table has a green border. The inner table has a blue border.
-->
<body>

  <table class="outer">
    <tr>
      <td style="padding: 40px 28px;">Table 1</td>
      <td>
        Table 1
        <br><br>
        <table class="inner">
          <tr>
            <td>Table 2</td>
            <td>Table 2</td>
          </tr>
          <tr>
            <td>Table 2</td>
            <td>Table 2</td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td>Table 1</td>
      <td>Table 1.</td>
    </tr>
  </table>

  <p align="center"><a href="index.html">Back to Practical File</a></p>

</body>
</html>
